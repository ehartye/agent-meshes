# Owner-confirmed 2026-10-19: sole user, fast pre-release iteration.
# Keep phase as one plain top-level enum. First matching area wins.
phase: dev
consumers:
  - The owner's plugin installations and personal project repositories, including Dead Redline; no external users or production support promise.
  - Preserve the owner's saved projects and source/output safety; phase alone does not authorize deleting data or breaking APIs.
weights:
  wait: 1
  agent: 1
  ci: 1
  churn: 1
lanes:
  edit:
    runs: affected-files
    trigger: agent-edit
  merge:
    runs: affected checks locally; quick non-blocking Linux observer on ordinary PRs
    trigger: pull-request
    os: [ubuntu]
  scheduled:
    runs: all
    trigger: weekly-cron
    os: [ubuntu, windows]
  release:
    runs: identity-only tag check in dev; full evidence required in test/production; owner smoke as needed
    trigger: version-tag
    os: [ubuntu]
areas:
  - path: tests/geometry_test_scope.py
    tier: critical
    why: Merge/full selection and prepared-fixture isolation.
  - path: tests/geometry-sweeps.json
    tier: critical
    why: Explicit deferred-test policy.
  - path: src/storage.ts
    tier: critical
    why: Saved-project persistence.
  - path: src/workspace*.ts
    tier: critical
    why: Durable authoring state and operations.
  - path: src/build*.ts
    tier: critical
    why: Build contracts and final artifact output safety.
  - path: src/author.ts
    tier: critical
    why: Blender source protection and authored output contract.
  - path: src/refine.ts
    tier: critical
    why: Refined artifact output and Blender process contract.
  - path: src/agent-contract.ts
    tier: critical
    why: Published agent-facing authoring and build contract.
  - path: src/export*.ts
    tier: critical
    why: Published GLB export contracts and artifact integrity.
  - path: src/core/model.ts
    tier: critical
    why: Saved-project schema and published model contract.
  - path: src/node-file-reader.ts
    tier: critical
    why: File access and input safety.
  - path: scripts/managed-runtime.js
    tier: critical
    why: Installed runtime and output safety.
  - path: scripts/ci-plan.mjs
    tier: critical
    why: Selected checks and aggregate status must fail closed.
  - path: scripts/check_docs.py
    tier: critical
    why: Replacement documentation gate and release metadata integrity.
  - path: .github/**
    tier: critical
    why: Verification and release policy.
  - path: .testing/**
    tier: critical
    why: Owner risk and verification policy.
  - path: src/core/**
    tier: standard
    why: Model helpers, rigging and poses; the saved model contract is classified above.
  - path: src/mechanisms/**
    tier: standard
    why: Mechanism generation and constraints.
  - path: src/physical/**
    tier: standard
    why: Physical kit assembly and connectivity.
  - path: src/physics/**
    tier: standard
    why: Simulation and motion calculations.
  - path: src/recipes/**
    tier: standard
    why: Procedural model and gait recipes.
  - path: src/render/**
    tier: standard
    why: Rendering, assembly and visual analysis.
  - path: src/web/**
    tier: standard
    why: Interactive viewer and authoring UI.
  - path: src/**
    tier: standard
    why: Modeling, rigging, rendering and current runtime behavior.
  - path: scripts/**
    tier: standard
    why: Authoring, generators and supporting tooling.
  - path: recipes/**
    tier: standard
    why: Editable examples; affected recipe checks and full scheduled/release studies, not universal artistic contracts.
  - path: tests/**
    tier: standard
    why: Test fixtures and test infrastructure, where no source subject resolves.
  - path: skills/**
    tier: low
    why: Prose guidance; metadata and local links still gate every PR.
  - path: docs/**
    tier: low
    why: Prose, examples and retained evidence; changed JSON and local links gate every PR.
  - path: README.md
    tier: low
    why: Documentation.
