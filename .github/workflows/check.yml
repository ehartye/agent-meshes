name: Check
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    name: Scope and documentation (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      javascript: ${{ steps.plan.outputs.javascript }}
      python: ${{ steps.plan.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: node --test tests/ci-plan.test.mjs
      - run: python tests/ci_docs.py
      - id: plan
        run: node scripts/ci-plan.mjs plan
      - name: Validate changed documentation and release metadata
        env:
          CHANGED_PATHS_FILE: ${{ steps.plan.outputs.paths_file }}
        run: python scripts/check_docs.py --paths-file "$CHANGED_PATHS_FILE"

  node:
    name: JavaScript (windows-latest)
    needs: quick
    if: needs.quick.outputs.javascript == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --test tests/botanical-kit.test.mjs
      - run: npx playwright install chromium
      # Run every test, keeping software-GPU capture separate from geometry workloads.
      - run: npm test -- --maxWorkers=2 --exclude tests/capture-views.test.ts
      - run: npm test -- tests/capture-views.test.ts --maxWorkers=1

  system-browser:
    name: System Chromium rendering (ubuntu-latest)
    needs: quick
    if: needs.quick.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Select the runner's installed Chrome
        shell: bash
        run: |
          echo "AGENT_MESHES_HOME=$RUNNER_TEMP/mesh-system-runtime" >> "$GITHUB_ENV"
          echo "npm_config_prefix=$RUNNER_TEMP/mesh-system-prefix" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/mesh-unused-browser-cache" >> "$GITHUB_ENV"
          browser="$(command -v google-chrome)"
          test -x "$browser"
          "$browser" --version
          echo "AGENT_MESHES_CHROMIUM_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Run the full JavaScript suite with the selected browser
        run: npm test -- --maxWorkers=2 --exclude tests/capture-views.test.ts
      - name: Run browser capture without concurrent geometry workloads
        run: npm test -- tests/capture-views.test.ts --maxWorkers=1
      - name: Install and verify a fresh managed runtime without downloading Chromium
        run: |
          node scripts/setup.js --json
          node scripts/setup.js --check --json
          test ! -d "$PLAYWRIGHT_BROWSERS_PATH"
      - name: Render through the configured browser and managed runtime
        run: node scripts/check-system-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-browser-render-evidence
          path: artifacts/system-browser/
          if-no-files-found: warn

  python:
    name: Python ${{ matrix.suite }} (windows-latest)
    needs: quick
    if: needs.quick.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [costume, character, face, geometry]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      # Keep each suite as a separate step so failures and timings stay visible.
      - if: matrix.suite == 'character'
        run: python tests/stylized_character.py
      - if: matrix.suite == 'character'
        run: python tests/stylized_walk.py
      - if: matrix.suite == 'costume'
        run: python tests/stylized_costume.py
      - if: matrix.suite == 'face'
        run: python tests/stylized_face.py
      - if: matrix.suite == 'face'
        run: python tests/blender_face_geometry.py
      - if: matrix.suite == 'face'
        run: python tests/lip_axis.py
      - if: matrix.suite == 'face'
        run: python tests/oriented_eyes.py
      - if: matrix.suite == 'face'
        run: python tests/geometry_eye_mask.py
      - if: matrix.suite == 'face'
        run: python tests/hm08_head.py
      - if: matrix.suite == 'geometry'
        run: python tests/blender_author_geometry.py
      - if: matrix.suite == 'geometry'
        run: python tests/blender_author_skin.py
      - if: matrix.suite == 'geometry'
        run: python tests/reproportion.py
      - if: matrix.suite == 'geometry'
        run: python tests/sculpt_landmarks.py
      - if: matrix.suite == 'geometry'
        run: python tests/garment_cuts.py
      - if: matrix.suite == 'geometry'
        run: python tests/garment_partition.py
      - if: matrix.suite == 'geometry'
        run: python tests/surface_fans.py
      - if: matrix.suite == 'geometry'
        run: python tests/offset_directions.py
      - if: matrix.suite == 'geometry'
        run: python tests/garment_neckbands.py
      - if: matrix.suite == 'geometry'
        run: python tests/cloth_flap.py
      - if: matrix.suite == 'geometry'
        run: python tests/skin_weight_relaxation.py
      - if: matrix.suite == 'geometry'
        run: python tests/skin_weight_transfer.py
      - if: matrix.suite == 'geometry'
        run: python tests/sculpted_face.py
      - if: matrix.suite == 'geometry'
        run: python tests/sculpted_jaw.py
      - if: matrix.suite == 'geometry'
        run: python tests/sprout_kin.py
      - if: matrix.suite == 'geometry'
        run: python tests/sprout_digit_proportions.py
      - if: matrix.suite == 'geometry'
        run: python tests/sprout_kin_rig.py
      - if: matrix.suite == 'geometry'
        run: python tests/sprout_region_skin.py
      - if: matrix.suite == 'geometry'
        run: python tests/sprout_kin_gait.py
      - if: matrix.suite == 'geometry'
        run: python tests/retarget.py
      - if: matrix.suite == 'geometry'
        run: python tests/motion_style.py
      - if: matrix.suite == 'geometry'
        run: python tests/motion_audit.py
      - if: matrix.suite == 'geometry'
        run: python tests/rig-library-output-protection.py

  required:
    name: CI required
    if: ${{ always() }}
    needs: [quick, node, python, system-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require every selected job to succeed
        env:
          CI_JAVASCRIPT: ${{ needs.quick.outputs.javascript }}
          CI_PYTHON: ${{ needs.quick.outputs.python }}
          CI_QUICK_RESULT: ${{ needs.quick.result }}
          CI_NODE_RESULT: ${{ needs.node.result }}
          CI_PYTHON_RESULT: ${{ needs.python.result }}
          CI_BROWSER_RESULT: ${{ needs.system-browser.result }}
        # Only deliberately unselected jobs may be skipped. Missing scope fails.
        run: node scripts/ci-plan.mjs gate
