name: Verify release candidate
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Release identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require successful full CI for this exact versioned source tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-candidate.mjs verify
